# ---------------------------------------------------------------
# dnsmasq – ProxyDHCP für UEFI-PXE mit Secure Boot
# Ziel: /etc/dnsmasq.d/pxe-proxy.conf
#
# Der produktive DHCP-Server vergibt weiterhin die IP-Adressen.
# dnsmasq antwortet nur mit den Boot-Informationen (ProxyDHCP).
#
# Platzhalter ersetzen:
#   <PXE_SERVER_IP>  Adresse dieses Servers im Deployment-VLAN
#   <INTERFACE>      Netzwerkschnittstelle (z. B. ens18)
# ---------------------------------------------------------------

# DNS-Funktion abschalten – vermeidet den Port-53-Konflikt mit systemd-resolved
port=0

interface=<INTERFACE>
bind-interfaces

# ProxyDHCP: keine eigene Adressvergabe
dhcp-range=<PXE_SERVER_IP>,proxy

# iPXE erkennt sich selbst über die User-Class
dhcp-userclass=set:ipxe,iPXE

# Stufe 1: UEFI-Firmware bekommt den signierten Shim per TFTP
pxe-service=tag:!ipxe,x86-64_EFI,"Windows 11 Deployment",shimx64.efi

# Stufe 2: iPXE (als grubx64.efi geladen) bekommt das Skript per HTTP
dhcp-boot=tag:ipxe,http://<PXE_SERVER_IP>/boot/boot.ipxe

# TFTP für shimx64.efi / grubx64.efi
# Alternativ kann TFTP von einem separaten Dienst (tftpd-hpa) übernommen werden –
# dann diese beiden Zeilen auskommentieren.
enable-tftp
tftp-root=/srv/tftp

# Ausführliches Logging während der Inbetriebnahme (journalctl -u dnsmasq)
log-dhcp
