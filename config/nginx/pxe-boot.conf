# ---------------------------------------------------------------
# nginx – HTTP-Boot für boot.ipxe, wimboot und boot.wim
# Ziel: /etc/nginx/sites-available/pxe-boot (+ Symlink nach sites-enabled)
#
# HTTP statt HTTPS ist eine bewusste Entscheidung (siehe docs/architektur.md).
# Der Zugriff wird deshalb auf das Deployment-VLAN beschränkt.
#
# Platzhalter: <DEPLOY_VLAN_CIDR>  z. B. 10.x.x.0/24
# ---------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;

    location /boot/ {
        allow <DEPLOY_VLAN_CIDR>;
        deny  all;

        autoindex off;

        # boot.wim ist ca. 500 MB groß
        sendfile on;
        tcp_nopush on;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/pxe-access.log;
    error_log  /var/log/nginx/pxe-error.log;
}
