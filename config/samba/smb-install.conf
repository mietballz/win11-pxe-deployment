# ---------------------------------------------------------------
# Samba – Installationsfreigabe für WinPE
# In /etc/samba/smb.conf einfügen bzw. per include einbinden.
#
# Kein Gastzugriff: WinPE verbindet sich mit dem Konto "deployment".
#   sudo useradd -M -s /usr/sbin/nologin deployment
#   sudo smbpasswd -a deployment
# ---------------------------------------------------------------
[global]
   server min protocol = SMB3
   map to guest = never
   restrict anonymous = 2

[install]
   comment = Windows 11 Installation Share
   path = /srv/samba/install
   valid users = deployment
   read only = yes
   browseable = no
